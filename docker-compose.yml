services:
  mysql:
    image: mysql:8
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    container_name: workinsight-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: workinsight
      MYSQL_ROOT_HOST: "%"
      MYSQL_USER: db_workinsight
      MYSQL_PASSWORD: pass_workinsight
      TZ: 'Asia/Tokyo'
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: workinsight-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - "./backend:/app"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/workinsight?serverTimezone=Asia/Tokyo
      SPRING_DATASOURCE_USERNAME: db_workinsight
      SPRING_DATASOURCE_PASSWORD: pass_workinsight
      JWT_SWECRET: ThisIsSuperSecureJwtSecretKey1234567890
      TZ: Asia/Tokyo

volumes:
  db-data:
